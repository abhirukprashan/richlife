<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <link rel="icon" href="/richlife-icon.svg?v=2" sizes="any" type="image/svg+xml" />
    <link rel="shortcut icon" href="/richlife-icon.svg?v=2" />
    <link rel="apple-touch-icon" href="/richlife-icon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
    />
    <link
      rel="preload"
      as="image"
      href="/box-backdrop.webp"
      imagesrcset="/box-backdrop-800.webp 800w, /box-backdrop.webp 1200w"
      imagesizes="(min-width: 1100px) 880px, 100vw"
      fetchpriority="high"
    />
    <link rel="preload" as="image" href="/richlife-logo.svg" />
    <style>
      /* Loading screen: shown before the app's code loads, removed by
         src/BootLoader.ts once the first-view assets are ready. */
      html.is-booting {
        overflow: hidden;
      }
      #boot-loader {
        position: fixed;
        z-index: 100;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, #0a1f8f 88%, #000),
          #0a1f8f 60%
        );
        transition: transform 1100ms cubic-bezier(0.7, 0, 0.2, 1);
      }
      #boot-loader .boot-logo {
        position: relative;
        z-index: 2;
        width: min(300px, 62vw);
        height: auto;
        animation: boot-breathe 1.8s ease-in-out infinite;
      }
      /* Milk filling the screen like a glass. --level (0-100%) is set by
         src/BootLoader.ts from the real loading progress. */
      #boot-loader {
        --level: 0%;
      }
      #boot-loader .boot-milk {
        position: absolute;
        z-index: 1;
        right: 0;
        /* Starts just below the screen so its wavy surface stays hidden. */
        bottom: -84px;
        left: 0;
        height: calc(var(--level) + 44px);
        /* Top sits 40px below the screen at --level 0, hiding the wave. */
        background: linear-gradient(#fff 0%, #f3f8ff 55%, #e6f1ff 100%);
        transition: height 750ms cubic-bezier(0.3, 0.7, 0.3, 1);
      }
      /* The milk surface: an SVG two screens wide sliding by one screen,
         so the wave loops seamlessly at a steady height. */
      #boot-loader .boot-wave {
        position: absolute;
        top: -38px;
        right: 0;
        left: 0;
        height: 40px;
        overflow: hidden;
        fill: #fff;
      }
      #boot-loader .boot-wave svg {
        display: block;
        width: 200%;
        height: 100%;
        animation: boot-slide 2.4s linear infinite;
      }
      /* The stream of milk pouring in from the top. */
      #boot-loader .boot-pour {
        position: absolute;
        z-index: 1;
        /* Starts above the screen and plunges deep into the milk, so the
           stream covers the whole way from the top edge to the surface. */
        top: -12px;
        bottom: calc(var(--level) - 48px);
        left: 50%;
        width: 48px;
        margin-left: -14px;
        border-radius: 0 0 35px 35px;
        background: linear-gradient(90deg, #dcebff, #fff 35%, #fff 65%, #dcebff);
        box-shadow: 0 0 24px rgb(255 255 255 / 0.45);
        transform-origin: top;
        transition:
          bottom 750ms cubic-bezier(0.3, 0.7, 0.3, 1),
          transform 450ms ease-in,
          opacity 450ms ease-in;
        animation:
          boot-pour-in 420ms ease-out both,
          boot-pour-wobble 0.5s ease-in-out infinite;
      }
      /* Once full, stop hanging below the screen so the wavy tail shows
         as it lifts away (the top is off-screen, so this is invisible). */
      #boot-loader.is-full {
        /* Milk covers everything now; matching it stops the blue bleeding
           through the bottom edge as a hairline while lifting. */
        background: #e6f1ff;
      }
      #boot-loader.is-full .boot-milk {
        bottom: 0;
      }
      #boot-loader.is-full .boot-pour {
        opacity: 0;
        transform: scaleY(0);
      }
      /* Wavy milky edge trailing under the screen as it lifts away. */
      #boot-loader .boot-tail {
        position: absolute;
        top: calc(100% - 6px);
        right: 0;
        left: 0;
        height: 52px;
        fill: #e6f1ff;
      }
      #boot-loader .boot-tail svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #boot-loader.is-lift {
        transform: translateY(calc(-100% - 70px));
      }
      @keyframes boot-breathe {
        50% {
          transform: scale(1.04);
        }
      }
      @keyframes boot-slide {
        to {
          transform: translateX(-50%);
        }
      }
      @keyframes boot-pour-in {
        from {
          transform: scaleY(0);
        }
      }
      @keyframes boot-pour-wobble {
        50% {
          width: 23px;
          margin-left: -11.5px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader {
          transition: opacity 400ms ease;
        }
        #boot-loader.is-lift {
          transform: none;
          opacity: 0;
        }
        #boot-loader .boot-logo,
        #boot-loader .boot-wave svg,
        #boot-loader .boot-pour {
          animation: none;
        }
        #boot-loader .boot-pour {
          display: none;
        }
      }
    </style>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <script>
      document.documentElement.classList.add("is-booting")
    </script>
    <div id="boot-loader" role="status" aria-label="Loading Rich Life">
      <div class="boot-pour"></div>
      <div class="boot-milk">
        <div class="boot-wave">
          <svg viewBox="0 0 2400 40" preserveAspectRatio="none">
            <path d="M0 20 Q150 0 300 20 T600 20 T900 20 T1200 20 T1500 20 T1800 20 T2100 20 T2400 20 V40 H0Z" />
          </svg>
        </div>
      </div>
      <img
        class="boot-logo"
        src="/richlife-logo.svg"
        alt="Rich Life"
        width="196"
        height="79"
      />
      <div class="boot-tail">
        <svg viewBox="0 0 2400 40" preserveAspectRatio="none">
          <path d="M0 0 H2400 V18 Q2250 40 2100 18 T1800 18 T1500 18 T1200 18 T900 18 T600 18 T300 18 T0 18 Z" />
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
